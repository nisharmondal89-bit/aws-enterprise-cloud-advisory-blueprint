services:
  localstack:
    image: localstack/localstack:3.8
    container_name: advisory-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,iam,ec2,sts,kms
      - DEBUG=0
      - DATA_DIR=/var/lib/localstack/data
    volumes:
      - "./.localstack:/var/lib/localstack"

  redis:
    image: redis:7.4-alpine
    container_name: advisory-elasticache-sim
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

